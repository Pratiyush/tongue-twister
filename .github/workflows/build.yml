name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Sign with the Play upload key when the secrets exist (not on forks).
      - name: Set up upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No upload key secrets: release builds use the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=$RUNNER_TEMP/upload.jks"
          } > android/key.properties
      # Release builds serve real ads (admob.json); local debug builds keep
      # Google's test ads so nobody clicks their own live ads.
      # Every CI run gets a higher build number (Android versionCode, iOS
      # CFBundleVersion), which the stores require for each upload.
      # One small APK per processor type, plus a universal APK that runs
      # everywhere (kept so the old download link still works).
      - run: flutter build apk --release --split-per-abi --dart-define-from-file=admob.json --build-number=${{ github.run_number }}
      - name: Collect per-processor APKs
        run: |
          mkdir -p dist
          out=build/app/outputs/flutter-apk
          cp "$out/app-arm64-v8a-release.apk"   dist/tongue-twisters-arm64-v8a.apk
          cp "$out/app-armeabi-v7a-release.apk" dist/tongue-twisters-armeabi-v7a.apk
          cp "$out/app-x86_64-release.apk"      dist/tongue-twisters-x86_64.apk
      - run: flutter build apk --release --dart-define-from-file=admob.json --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk dist/tongue-twisters.apk
      # Google Play only accepts an Android App Bundle.
      - run: flutter build appbundle --release --dart-define-from-file=admob.json --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/bundle/release/app-release.aab dist/tongue-twisters.aab
      # Shows which key signed the bundle (upload key: SHA256 92:EF:99:BE...).
      - run: keytool -printcert -jarfile dist/tongue-twisters.aab | grep -E 'Owner|SHA256:'
      - run: ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: tongue-twisters-android
          path: |
            dist/*.apk
            dist/*.aab

  ios:
    name: iOS app (unsigned)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define-from-file=admob.json --build-number=${{ github.run_number }}
      # Package the .app as an .ipa. It is unsigned: sign it (e.g. with
      # Sideloadly/AltStore or Xcode) before installing on an iPhone.
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr tongue-twisters-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: tongue-twisters-ios
          path: tongue-twisters-unsigned.ipa

  release:
    name: Publish GitHub Release
    # Tags publish that version; pushes to the default branch publish a
    # numbered build, so the "latest release" download link always works.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name != 'pull_request' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out release tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=Tongue Twisters ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
            echo "tag=v${version}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "name=Tongue Twisters ${version} (build ${GITHUB_RUN_NUMBER})" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Which Android file?**
            - `tongue-twisters-arm64-v8a.apk`: almost every phone from the last ~8 years (start here)
            - `tongue-twisters-armeabi-v7a.apk`: older 32-bit phones
            - `tongue-twisters-x86_64.apk`: emulators and Chromebooks
            - `tongue-twisters.apk`: universal, works everywhere but is larger

            `tongue-twisters.aab` is the bundle for uploading to Google Play, not for installing.

            `tongue-twisters-unsigned.ipa` is the iOS build; sign it (Sideloadly, AltStore or Xcode) before installing.

            Made with ❤️ by Pratiyush Kumar Singh
          files: |
            tongue-twisters*.apk
            tongue-twisters.aab
            tongue-twisters-unsigned.ipa
          generate_release_notes: true
